version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - bodyclose

formatters:
  enable:
    - gofmt
    - goimports

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
