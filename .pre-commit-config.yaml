repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - feat
          - fix
          - docs
          - refactor
          - perf
          - test
          - build
          - ci
          - chore
          - revert

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        description: Run golangci-lint (asdf-pinned v2.12.2) over the module
        entry: asdf exec golangci-lint run
        types: [go]
        language: system
        pass_filenames: false
        require_serial: true

      - id: yamllint
        name: yamllint
        description: Lint YAML files with the asdf-pinned yamllint
        entry: asdf exec yamllint
        types: [yaml]
        language: system

      - id: actionlint
        name: actionlint
        description: Lint GitHub Actions workflows with the asdf-pinned actionlint
        entry: asdf exec actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        types: [yaml]
