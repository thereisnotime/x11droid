name: OpenSpec Badge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-badge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Pin OpenSpec to the version this repo uses. The badge action only
      # installs OpenSpec if it isn't already on PATH (`command -v openspec`),
      # and otherwise grabs @latest — where `openspec spec list` is removed and
      # the action breaks. Pre-installing 1.2.0 keeps the action on a compatible CLI.
      - name: Install OpenSpec 1.2.0
        run: npm install -g @fission-ai/openspec@1.2.0

      - uses: weAretechnative/openspec-badge-action@40e003127410d7fca906446136fde04cf177b225 # v1.1.1
        with:
          # Only spec-based metrics: the change-based ones (tasks_status,
          # open_changes) crash the action under `pipefail` when there are no
          # active changes. Re-add once changes exist.
          metric_types: number_of_specs,number_of_requirements
