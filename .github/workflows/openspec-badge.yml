name: OpenSpec Badge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-badge-${{ github.ref }}
  cancel-in-progress: true

# Self-contained badge generation. The off-the-shelf openspec-badge-action
# unconditionally runs a change-collection step that crashes (under pipefail)
# when there are no active changes, so we compute the counts ourselves with the
# pinned OpenSpec CLI and publish shields SVGs to gh-pages.
jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.2.0

      - name: Generate OpenSpec badges
        run: |
          specs=$(openspec spec list --json 2>/dev/null)
          n_specs=$(echo "$specs" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).length')
          n_reqs=$(echo "$specs" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).reduce((s,x)=>s+(x.requirementCount||0),0)')
          echo "specs=$n_specs requirements=$n_reqs"
          mkdir -p site/badges
          curl -fsSL "https://img.shields.io/badge/specs-${n_specs}-8A2BE2" -o site/badges/number_of_specs.svg
          curl -fsSL "https://img.shields.io/badge/requirements-${n_reqs}-blue" -o site/badges/number_of_requirements.svg

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
