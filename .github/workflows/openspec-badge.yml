name: OpenSpec Badge

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openspec-badge-${{ github.ref }}
  cancel-in-progress: true

# Self-contained badge generation. The off-the-shelf openspec-badge-action
# unconditionally runs a change-collection step that crashes (under pipefail)
# when there are no active changes, so we compute the counts ourselves with the
# pinned OpenSpec CLI and publish shields SVGs to gh-pages.
jobs:
  badge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.2.0

      - name: Generate OpenSpec badges
        run: |
          # Every OpenSpec call has a fallback and every parse is wrapped in
          # try/catch so the step always succeeds and publishes all four badges
          # (with 0 values when there's nothing yet), regardless of CLI quirks.
          specs=$(openspec spec list --json 2>/dev/null || echo '[]')
          changes_raw=$(openspec list --changes --json 2>/dev/null || echo '{"changes":[]}')
          jp() { node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(String($1))}catch(e){process.stdout.write('0')}})"; }
          n_specs=$(printf '%s' "$specs"       | jp 'JSON.parse(d).length')
          n_reqs=$(printf '%s' "$specs"        | jp 'JSON.parse(d).reduce((s,x)=>s+(x.requirementCount||0),0)')
          n_changes=$(printf '%s' "$changes_raw" | jp '(JSON.parse(d).changes||[]).length')
          done_tasks=$(printf '%s' "$changes_raw" | jp '(JSON.parse(d).changes||[]).reduce((s,x)=>s+(x.completedTasks||0),0)')
          total_tasks=$(printf '%s' "$changes_raw" | jp '(JSON.parse(d).changes||[]).reduce((s,x)=>s+(x.totalTasks||0),0)')
          echo "specs=$n_specs requirements=$n_reqs open_changes=$n_changes tasks=$done_tasks/$total_tasks"
          mkdir -p site/badges
          curl -fsSL "https://img.shields.io/badge/specs-${n_specs}-8A2BE2" -o site/badges/number_of_specs.svg
          curl -fsSL "https://img.shields.io/badge/requirements-${n_reqs}-blue" -o site/badges/number_of_requirements.svg
          curl -fsSL "https://img.shields.io/badge/tasks-${done_tasks}%2F${total_tasks}-lightgrey" -o site/badges/tasks_status.svg
          curl -fsSL "https://img.shields.io/badge/open_changes-${n_changes}-orange" -o site/badges/open_changes.svg

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
